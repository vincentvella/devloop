<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>devloop — timeline</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: #0d1117; color: #c9d1d9; }
      header { position: sticky; top: 0; display: flex; gap: 8px; align-items: center; padding: 8px 10px; background: #161b22; border-bottom: 1px solid #30363d; }
      header input { flex: 1; background: #0d1117; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; padding: 4px 8px; }
      header button { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; padding: 4px 8px; cursor: pointer; }
      .controls { display: flex; gap: 8px; align-items: center; padding: 8px 10px 0; }
      .controls input, .controls select { background: #0d1117; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; padding: 4px 8px; }
      .controls #project { flex: 1; }
      .controls #url { flex: 1; }
      .controls #devcmd { flex: 1; }
      .controls #devcwd { flex: 1; }
      .controls button { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; padding: 4px 8px; cursor: pointer; }
      .status { opacity: 0.7; white-space: nowrap; }
      #panes { flex-wrap: wrap; }
      .pane { display: inline-flex; align-items: center; gap: 6px; background: #21262d; border: 1px solid #30363d; border-radius: 6px; padding: 3px 6px 3px 10px; cursor: pointer; }
      .pane.active { border-color: #d2a8ff; color: #d2a8ff; }
      .pane .x { opacity: 0.5; padding: 0 2px; }
      .pane .x:hover { opacity: 1; color: #f85149; }
      .row .tgt { opacity: 0.4; margin-right: 6px; }
      #steps { padding: 0 10px; }
      .step { display: flex; gap: 6px; align-items: center; padding: 3px 0; }
      .step select, .step input { background: #0d1117; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; padding: 3px 6px; }
      .step input { flex: 1; }
      .step .del { cursor: pointer; opacity: 0.5; padding: 0 4px; }
      .step .del:hover { opacity: 1; color: #f85149; }
      label { user-select: none; }
      #list { padding: 6px 0; }
      .row { padding: 2px 10px; white-space: pre-wrap; word-break: break-word; border-left: 3px solid transparent; }
      .row .tag { opacity: 0.55; margin-right: 8px; }
      .server { color: #79c0ff; }
      .browser { color: #d2a8ff; }
      .repro { color: #7ee787; border-left-color: #2ea043; }
      .repro .tag { color: #7ee787; }
      .err { background: #2d1517; border-left-color: #f85149; color: #ffa198; }
    </style>
  </head>
  <body>
    <div class="controls" id="panes"></div>
    <div class="controls">
      <select id="project"><option value="">— project —</option></select>
      <button id="open">open</button>
      <input id="pname" placeholder="save as…" style="max-width: 120px" />
      <button id="save">save</button>
    </div>
    <div class="controls">
      <input id="url" placeholder="http://localhost:3000  →  Enter to navigate" />
      <button id="go">go</button>
    </div>
    <div class="controls">
      <input id="devcmd" placeholder="dev cmd (blank = auto-detect)" />
      <button id="browse">📁</button>
      <input id="devcwd" placeholder="project cwd" />
      <button id="devbtn">dev start</button>
      <span id="devstatus" class="status">dev: stopped</span>
    </div>
    <div class="controls">
      <strong style="opacity:0.7">repro</strong>
      <button id="addstep">+ step</button>
      <button id="runrepro">run ▶</button>
      <span id="reprostatus" class="status"></span>
    </div>
    <div id="steps"></div>
    <header>
      <input id="filter" placeholder="filter (substring)…" />
      <label><input type="checkbox" id="errOnly" /> errors only</label>
      <button id="clear">clear</button>
    </header>
    <div id="list"></div>
    <script type="module" src="./timeline.js"></script>
  </body>
</html>
