<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>devloop</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
             font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: #0d1117; color: #c9d1d9; }

      /* toolbar */
      #toolbar { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; background: #161b22; border-bottom: 1px solid #30363d; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      input, select, button { background: #0d1117; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; padding: 4px 8px; }
      button { background: #21262d; cursor: pointer; }
      #url { flex: 1; min-width: 180px; }
      #project { flex: 1; min-width: 120px; }
      #devcmd, #devcwd { flex: 1; min-width: 100px; }
      .status { opacity: 0.7; white-space: nowrap; }
      #devchip { padding: 2px 8px; border: 1px solid #30363d; border-radius: 6px; }
      #devchip.running { color: #3fb950; border-color: #238636; }
      #devchip.failed { color: #ffa198; border-color: #f85149; }
      .sep { width: 1px; align-self: stretch; background: #30363d; margin: 0 2px; }
      .spacer { flex: 1; }
      label { user-select: none; }

      /* collapsible controls */
      #controls { display: flex; flex-direction: column; gap: 6px; }
      #controls.collapsed { display: none; }

      /* pane tabs */
      .tabs { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .pane { display: inline-flex; align-items: center; gap: 6px; background: #21262d; border: 1px solid #30363d; border-radius: 6px; padding: 3px 6px 3px 10px; cursor: pointer; }
      .pane.active { border-color: #d2a8ff; color: #d2a8ff; }
      .pane.popped { opacity: 0.6; font-style: italic; }
      .pane .x { opacity: 0.5; padding: 0 2px; }
      .pane .x:hover { opacity: 1; color: #f85149; }

      /* body split: browser area + collapsible timeline sidebar */
      #body { display: flex; flex: 1; min-height: 0; }
      #browserarea { flex: 1; position: relative; background: #010409; }
      #browserarea .hint { position: absolute; inset: 0; display: grid; place-items: center; color: #6e7681; text-align: center; padding: 20px; }
      #sidebar { width: 460px; display: flex; flex-direction: column; border-left: 1px solid #30363d; overflow: hidden; transition: width 0.12s ease; }
      #sidebar.collapsed { width: 0; border-left: none; }

      /* repro builder */
      #steps { padding: 4px 10px; }
      .step { display: flex; gap: 6px; align-items: center; padding: 3px 0; }
      .step input { flex: 1; }
      .step .del { cursor: pointer; opacity: 0.5; padding: 0 4px; }
      .step .del:hover { opacity: 1; color: #f85149; }

      /* timeline */
      #filterbar { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-top: 1px solid #30363d; }
      #filter { flex: 1; }
      #list { flex: 1; overflow-y: auto; padding: 6px 0; }
      .logrow { padding: 2px 10px; white-space: pre-wrap; word-break: break-word; border-left: 3px solid transparent; }
      .logrow .tag { opacity: 0.55; margin-right: 8px; }
      .logrow .tgt { opacity: 0.4; margin-right: 6px; }
      .server { color: #79c0ff; }
      .browser { color: #d2a8ff; }
      .repro { color: #7ee787; border-left-color: #2ea043; }
      .repro .tag { color: #7ee787; }
      .logrow img.shot { display: block; max-width: 320px; max-height: 200px; margin-top: 4px; border: 1px solid #30363d; border-radius: 6px; }
      .err { background: #2d1517; border-left-color: #f85149; color: #ffa198; }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <div class="row">
        <span id="panes" class="tabs"></span>
        <span class="spacer"></span>
        <span id="devchip" class="status">dev: —</span>
        <button id="play" title="start / stop dev server">▶</button>
        <button id="restart" title="restart dev server">⟳</button>
        <button id="refresh" title="refresh page">⟲</button>
        <button id="hardrefresh" title="hard refresh (ignore cache)">⤓</button>
        <button id="shot" title="screenshot active pane → timeline">📷</button>
        <span class="sep"></span>
        <button id="controlsToggle" title="settings">⚙</button>
        <button id="pop" title="pop active pane into its own window">⤢</button>
        <button id="toggle">⟨ timeline</button>
      </div>
      <div id="controls" class="collapsed">
        <div class="row">
          <input id="url" placeholder="3000  or  http://localhost:3000  →  Enter" />
          <button id="go">go</button>
          <select id="project"><option value="">— project —</option></select>
          <button id="open">open</button>
          <input id="pname" placeholder="save as…" style="max-width: 120px" />
          <button id="save">save</button>
        </div>
        <div class="row">
          <input id="devcmd" placeholder="dev cmd (blank = auto-detect)" />
          <button id="browse">📁</button>
          <input id="devcwd" placeholder="project cwd" />
          <button id="setconfig">set dev config</button>
        </div>
      </div>
    </div>

    <div id="body">
      <div id="browserarea"><div class="hint">browser pane — enter a URL or open a project</div></div>
      <div id="sidebar">
        <div class="row" style="padding: 8px 10px 0">
          <strong style="opacity: 0.7">repro</strong>
          <button id="addstep">+ step</button>
          <button id="runrepro">run ▶</button>
          <span id="reprostatus" class="status"></span>
        </div>
        <div id="steps"></div>
        <div id="filterbar">
          <input id="filter" placeholder="filter (substring)…" />
          <label><input type="checkbox" id="errOnly" /> errors only</label>
          <button id="clear">clear</button>
        </div>
        <div id="list"></div>
      </div>
    </div>
    <script type="module" src="./timeline.js"></script>
  </body>
</html>
