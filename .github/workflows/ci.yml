name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast lane: types, unit tests, and that both bundles build / parse.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Typecheck (core + renderer)
        run: bun run typecheck
      - name: Unit tests
        run: bun test
      - name: Build cockpit + stdio bundles
        run: bun run app:build && bun run mcp:build
      - name: Sanity-check the published bundle parses under node
        run: node --check dist/index.cjs

  # Behavioral: drive the real stdio (Puppeteer) server end-to-end against the fixture.
  smoke:
    runs-on: ubuntu-latest
    env:
      DEVLOOP_NO_SANDBOX: "true" # CI Chrome can't use the sandbox
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Install Chrome for Puppeteer
        run: bunx puppeteer browsers install chrome
      - name: Smoke test (stdio MCP + fixture)
        run: bun run test-smoke.ts

  # Behavioral: the offscreen Electron cockpit selftest (macOS — no xvfb needed).
  selftest:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile # electron postinstall via trustedDependencies
      - name: Ensure electron binary (postinstall is flaky — path.txt sometimes unwritten)
        run: test -f node_modules/electron/path.txt || node node_modules/electron/install.js
      - name: Cockpit selftest (offscreen Electron)
        run: bun run app:selftest

  # End-to-end: drive the real renderer DOM via Playwright (macOS provides a window
  # server; the suite re-execs under node since Playwright's Electron handshake hangs
  # under bun). Runs the default scenarios only — the GUI_EXT_E2E flow hits the live
  # Chrome Web Store and is left for manual runs.
  gui:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Install with bun FIRST, in a clean env — setup-node before this skips electron's
      # binary postinstall (path.txt never gets written → electron.launch ENOENT).
      - run: bun install --frozen-lockfile # electron postinstall via trustedDependencies
      - name: Ensure the Electron binary is present
        run: test -f node_modules/electron/path.txt || node node_modules/electron/install.js
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # the driver runs under node (TS type-stripping needs >= 22.18)
      - name: GUI end-to-end (Playwright + Electron)
        run: bun run app:gui
