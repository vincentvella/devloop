name: Release

# Tag a version (e.g. v0.1.0) to build cross-platform installers + publish the MCP.
# Everything is built in CI — no local builds needed.
on:
  push:
    tags: ["v*"]

jobs:
  # Build the Electron cockpit installers on each OS (electron-builder can't
  # cross-compile reliably, so we use a matrix of native runners). Each runner
  # uploads its installers to the same GitHub Release (draft) for this tag.
  installers:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run app:build
      - name: Build + publish installer to the GitHub Release
        run: bunx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish the stdio MCP to npm (needs an NPM_TOKEN repo secret).
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run mcp:build
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
