name: Release

# Tag a version (e.g. v0.1.0) to build cross-platform installers + publish the MCP.
# Everything is built in CI — no local builds needed.
on:
  push:
    tags: ["v*"]

jobs:
  # Guard: the tag (vX.Y.Z) must match package.json version, or electron-builder
  # names artifacts for the wrong version and they land in the wrong release.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(grep -m1 '"version"' package.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')"
          echo "tag=$TAG package.json=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "::error::tag $GITHUB_REF_NAME != package.json $PKG — bump package.json"; exit 1; }

  # Build the Electron cockpit installers on each OS (electron-builder can't
  # cross-compile reliably, so we use a matrix of native runners). Each runner
  # uploads its installers to the same GitHub Release (draft) for this tag.
  installers:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    needs: verify-version
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run app:build
      - name: Prepare macOS signing + notarization (Developer ID cert + API key)
        if: runner.os == 'macOS'
        run: |
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "CSC_LINK=$MAC_CSC_LINK"
            echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Build + publish installer to the GitHub Release
        run: bunx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish the stdio MCP to npm via Trusted Publishing (OIDC) — no token/secret.
  # Requires a trusted publisher configured on the devloop-mcp npm package
  # (GitHub: vincentvella/devloop, workflow release.yml).
  npm:
    runs-on: ubuntu-latest
    needs: verify-version
    permissions:
      id-token: write # mint the OIDC token npm verifies
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
      - run: bun install --frozen-lockfile
      - run: bun run mcp:build
      - name: Publish to npm (OIDC; skip if this version is already published)
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "devloop-mcp@$V" version >/dev/null 2>&1; then
            echo "devloop-mcp@$V already on npm — skipping publish."
            exit 0
          fi
          # `npm install -g npm@latest` (needed for Trusted Publishing — npm >= 11.5.1)
          # intermittently leaves the global npm missing `sigstore`, which provenance
          # requires → "Cannot find module 'sigstore'" and a failed release (hit on
          # v0.10.0). Reinstall + publish with retries so a flaky self-install self-heals
          # instead of needing a manual re-run. The already-published guard above keeps
          # it idempotent if an attempt partially succeeds.
          for attempt in 1 2 3; do
            echo "::group::npm publish attempt $attempt"
            if npm install -g npm@latest && npm publish --access public; then
              echo "::endgroup::"; echo "published devloop-mcp@$V on attempt $attempt"; exit 0
            fi
            echo "::endgroup::"; echo "attempt $attempt failed — retrying in 5s"; sleep 5
          done
          echo "npm publish failed after 3 attempts"; exit 1

  # Publish server.json to the official MCP Registry via GitHub Actions OIDC —
  # no token/secret (the io.github.vincentvella namespace is authorized by the
  # OIDC token's repo owner). Runs after npm so the published package carries the
  # matching mcpName the registry validates. Independent of installers/Latest.
  mcp-registry:
    runs-on: ubuntu-latest
    needs: npm
    permissions:
      id-token: write # mint the OIDC token the registry verifies
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install mcp-publisher
        run: |
          url=$(gh api repos/modelcontextprotocol/registry/releases/latest \
            --jq '.assets[] | select(.name=="mcp-publisher_linux_amd64.tar.gz") | .browser_download_url')
          curl -fsSL "$url" | tar -xz mcp-publisher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to the MCP Registry (OIDC; skip if this version is already published)
        run: |
          V="$(grep -m1 '"version"' server.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')"
          if curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.vincentvella/devloop" | grep -q "\"version\":\"$V\""; then
            echo "io.github.vincentvella/devloop@$V already in the registry — skipping."
            exit 0
          fi
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  # All installers uploaded → flip the draft electron-builder created into a
  # published Latest release. Gated on `installers` only (not npm), so the
  # installers ship as Latest even if the independent npm publish hiccups.
  publish-release:
    runs-on: ubuntu-latest
    needs: installers
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Promote the draft release to Latest
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
