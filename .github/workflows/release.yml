name: Release

# Tag a version (e.g. v0.1.0) to build cross-platform installers + publish the MCP.
on:
  push:
    tags: ["v*"]

jobs:
  # Build the Electron cockpit installers on each OS (electron-builder can't
  # cross-compile reliably, so we use a matrix of native runners).
  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run app:build
      - name: Build installer
        run: bunx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: devloop-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: ignore

  # Publish the stdio MCP to npm (needs an NPM_TOKEN secret).
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run mcp:build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
