appId: com.devloop.app
productName: Devloop
copyright: Devloop

# CI uploads installers to a GitHub Release (draft) for this version.
publish:
  provider: github
  owner: vincentvella
  repo: devloop
  releaseType: draft

directories:
  output: release
  buildResources: assets

# main.cjs has all deps bundled (only electron is external), so the package is
# just the built output + the runtime — no node_modules (keeps puppeteer/chromium out).
files:
  - out/**/*
  - package.json

asar: true

mac:
  icon: assets/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  notarize: true # via App Store Connect API key (APPLE_API_KEY/_ID/_ISSUER env in CI)
  # Build both Apple Silicon (arm64) and Intel (x64) installers. The macOS runner
  # is arm64, but electron-builder downloads the x64 Electron and cross-packages it.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]

win:
  icon: assets/icon.ico
  target:
    - nsis

linux:
  icon: assets/icons/512x512.png
  category: Development
  maintainer: Vincent Vella <vincevella0@gmail.com>
  target:
    - AppImage
    - deb
