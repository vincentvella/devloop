appId: com.devloop.app
productName: Devloop
copyright: Devloop

# CI uploads installers to a GitHub Release (draft) for this version.
publish:
  provider: github
  owner: vincentvella
  repo: devloop
  releaseType: draft

directories:
  output: release
  buildResources: assets

# main.cjs has all deps bundled (only electron is external), so the package is
# just the built output + the runtime — no node_modules (keeps puppeteer/chromium out).
files:
  - out/**/*
  - package.json

asar: true

mac:
  icon: assets/icon.icns
  # Vendor serve-sim (the iOS-simulator capture engine) so the embedded simulator works
  # offline with no bunx/npx/network. macOS ONLY — iOS simulators need simctl/idb, so it's
  # useless (and just bloat) on Windows/Linux. We run its ESM entry via Electron's own Node
  # (ELECTRON_RUN_AS_NODE); the entry imports `ws` + `inspect-webkit`, so all three ship in a
  # real node_modules/ layout for ESM resolution. Lands unpacked (the Swift helper binary
  # can't run from inside asar) at Contents/Resources/node_modules/. Swift sources/READMEs dropped.
  extraResources:
    - from: node_modules/serve-sim
      to: node_modules/serve-sim
      filter:
        - "**/*"
        - "!Sources/**"
        - "!README.md"
    - from: node_modules/ws
      to: node_modules/ws
      filter:
        - "**/*"
        - "!README.md"
    - from: node_modules/inspect-webkit
      to: node_modules/inspect-webkit
      filter:
        - "**/*"
        - "!README.md"
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  notarize: true # via App Store Connect API key (APPLE_API_KEY/_ID/_ISSUER env in CI)
  # Build both Apple Silicon (arm64) and Intel (x64) installers. The macOS runner
  # is arm64, but electron-builder downloads the x64 Electron and cross-packages it.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]

win:
  icon: assets/icon.ico
  target:
    - nsis

linux:
  icon: assets/icons/512x512.png
  category: Development
  maintainer: Vincent Vella <vincevella0@gmail.com>
  target:
    - AppImage
    - deb
